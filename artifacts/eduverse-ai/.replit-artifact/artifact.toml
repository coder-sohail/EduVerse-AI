kind = "web"
previewPath = "/"
title = "EduVerse AI"
description = "A personalized student ecosystem that connects learning, AI study help, study planning, career discovery, roadmaps, and skill-gap progress in one focused MVP."
version = "1.0.0"
id = "artifacts/eduverse-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23307

[services.development]
run = "pnpm --filter @workspace/eduverse-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eduverse-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/eduverse-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23307"
BASE_PATH = "/"
