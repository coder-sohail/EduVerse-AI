openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: EduVerse AI MVP API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: student
    description: Student profile and dashboard
  - name: learning
    description: Learning resources and study tasks
  - name: careers
    description: Career discovery and roadmaps
  - name: ai
    description: Context-aware study assistance
  - name: opportunities
    description: Scholarships, internships, events, and jobs
  - name: community
    description: Student communities and peer learning
  - name: refreshment
    description: Short quizzes and learning challenges
  - name: teachers
    description: Teacher portal insights
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /student/profile:
    get:
      operationId: getStudentProfile
      tags: [student]
      summary: Get the current student profile
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
    patch:
      operationId: updateStudentProfile
      tags: [student]
      summary: Update the current student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentProfileUpdate"
      responses:
        "200":
          description: Updated student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
  /student/dashboard:
    get:
      operationId: getStudentDashboard
      tags: [student]
      summary: Get a personalized student dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /learning/resources:
    get:
      operationId: listLearningResources
      tags: [learning]
      summary: List recommended learning resources
      parameters:
        - name: subject
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [video, article, practice, course]
      responses:
        "200":
          description: Learning resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningResource"
  /learning/resources/{id}/bookmark:
    patch:
      operationId: toggleResourceBookmark
      tags: [learning]
      summary: Bookmark or unbookmark a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkUpdate"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningResource"
  /study/tasks:
    get:
      operationId: listStudyTasks
      tags: [learning]
      summary: List the student's study tasks
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [today, week, month]
      responses:
        "200":
          description: Study tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyTask"
    post:
      operationId: createStudyTask
      tags: [learning]
      summary: Create a study task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyTaskInput"
      responses:
        "201":
          description: Created study task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyTask"
  /study/tasks/{id}:
    patch:
      operationId: updateStudyTask
      tags: [learning]
      summary: Update a study task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyTaskUpdate"
      responses:
        "200":
          description: Updated study task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyTask"
  /careers:
    get:
      operationId: listCareers
      tags: [careers]
      summary: List career paths matched to the student
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Career paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Career"
  /careers/{id}:
    get:
      operationId: getCareer
      tags: [careers]
      summary: Get a career path and its requirements
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Career path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Career"
  /roadmap:
    get:
      operationId: getCareerRoadmap
      tags: [careers]
      summary: Get the student's active career roadmap
      responses:
        "200":
          description: Career roadmap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerRoadmap"
  /roadmap/milestones/{id}:
    patch:
      operationId: updateRoadmapMilestone
      tags: [careers]
      summary: Update a roadmap milestone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneUpdate"
      responses:
        "200":
          description: Updated milestone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapMilestone"
  /skills/gaps:
    get:
      operationId: getSkillGaps
      tags: [careers]
      summary: Get prioritized skill gaps for the active career
      responses:
        "200":
          description: Skill gap analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillGapAnalysis"
  /ai/chat:
    post:
      operationId: sendAiChatMessage
      tags: [ai]
      summary: Send a context-aware study question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: AI study assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: List relevant student opportunities
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [all, scholarship, internship, hackathon, event, job]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
  /opportunities/{id}/save:
    patch:
      operationId: toggleOpportunitySave
      tags: [opportunities]
      summary: Save or unsave an opportunity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedUpdate"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
  /community/posts:
    get:
      operationId: listCommunityPosts
      tags: [community]
      summary: List community posts
      responses:
        "200":
          description: Community posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityPost"
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: Create a community post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostInput"
      responses:
        "201":
          description: Created community post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"
  /community/posts/{id}/like:
    patch:
      operationId: toggleCommunityPostLike
      tags: [community]
      summary: Like or unlike a community post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LikeUpdate"
      responses:
        "200":
          description: Updated community post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"
  /refreshment/quizzes:
    get:
      operationId: listRefreshmentQuizzes
      tags: [refreshment]
      summary: List short learning quizzes
      responses:
        "200":
          description: Learning quizzes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quiz"
  /teacher/dashboard:
    get:
      operationId: getTeacherDashboard
      tags: [teachers]
      summary: Get teacher portal dashboard
      responses:
        "200":
          description: Teacher dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherDashboard"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudentProfile:
      type: object
      required: [id, name, educationLevel, school, classYear, stream, subjects, interests, careerGoal, weeklyHours, avatarInitials]
      properties:
        id: { type: string }
        name: { type: string }
        educationLevel:
          type: string
          enum: [below_ug, undergraduate, postgraduate]
        school: { type: string }
        classYear: { type: string }
        stream: { type: string }
        subjects:
          type: array
          items: { type: string }
        interests:
          type: array
          items: { type: string }
        careerGoal: { type: string }
        weeklyHours: { type: number }
        avatarInitials: { type: string }
    StudentProfileUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        educationLevel:
          type: string
          enum: [below_ug, undergraduate, postgraduate]
        school: { type: string }
        classYear: { type: string }
        stream: { type: string }
        subjects:
          type: array
          items: { type: string }
        interests:
          type: array
          items: { type: string }
        careerGoal: { type: string }
        weeklyHours: { type: number, minimum: 1, maximum: 80 }
    Dashboard:
      type: object
      required: [greeting, focus, streak, weeklyProgress, completedTasks, totalTasks, nextTask, recommendedResources, careerMatch, skillGapCount, recentActivity]
      properties:
        greeting: { type: string }
        focus: { type: string }
        streak: { type: number }
        weeklyProgress: { type: number }
        completedTasks: { type: number }
        totalTasks: { type: number }
        nextTask:
          anyOf:
            - $ref: "#/components/schemas/StudyTask"
            - type: "null"
        recommendedResources:
          type: array
          items:
            $ref: "#/components/schemas/LearningResource"
        careerMatch:
          $ref: "#/components/schemas/Career"
        skillGapCount: { type: number }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    LearningResource:
      type: object
      required: [id, title, subject, type, duration, description, level, progress, bookmarked, accent]
      properties:
        id: { type: string }
        title: { type: string }
        subject: { type: string }
        type:
          type: string
          enum: [video, article, practice, course]
        duration: { type: string }
        description: { type: string }
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        progress: { type: number, minimum: 0, maximum: 100 }
        bookmarked: { type: boolean }
        accent: { type: string }
    BookmarkUpdate:
      type: object
      required: [bookmarked]
      properties:
        bookmarked: { type: boolean }
    StudyTask:
      type: object
      required: [id, title, subject, date, duration, status, priority, kind]
      properties:
        id: { type: string }
        title: { type: string }
        subject: { type: string }
        date: { type: string }
        duration: { type: number }
        status:
          type: string
          enum: [todo, in_progress, completed]
        priority:
          type: string
          enum: [low, medium, high]
        kind: { type: string }
    StudyTaskInput:
      type: object
      required: [title, subject, date, duration]
      properties:
        title: { type: string, minLength: 1 }
        subject: { type: string, minLength: 1 }
        date: { type: string, minLength: 1 }
        duration: { type: number, minimum: 5, maximum: 480 }
        priority:
          type: string
          enum: [low, medium, high]
    StudyTaskUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [todo, in_progress, completed]
        title: { type: string, minLength: 1 }
        priority:
          type: string
          enum: [low, medium, high]
    Career:
      type: object
      required: [id, title, category, match, description, whyItFits, skills, subjects, pathway, color]
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        match: { type: number, minimum: 0, maximum: 100 }
        description: { type: string }
        whyItFits: { type: string }
        skills:
          type: array
          items: { type: string }
        subjects:
          type: array
          items: { type: string }
        pathway:
          type: array
          items: { type: string }
        color: { type: string }
    CareerRoadmap:
      type: object
      required: [career, progress, estimatedWeeks, milestones]
      properties:
        career:
          $ref: "#/components/schemas/Career"
        progress: { type: number, minimum: 0, maximum: 100 }
        estimatedWeeks: { type: number }
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapMilestone"
    RoadmapMilestone:
      type: object
      required: [id, title, description, status, duration, order]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [completed, active, locked]
        duration: { type: string }
        order: { type: number }
    MilestoneUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [completed, active, locked]
    SkillGapAnalysis:
      type: object
      required: [career, overall, skills]
      properties:
        career: { type: string }
        overall: { type: number, minimum: 0, maximum: 100 }
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillGap"
    SkillGap:
      type: object
      required: [id, name, level, target, status, priority, recommendation]
      properties:
        id: { type: string }
        name: { type: string }
        level: { type: number, minimum: 0, maximum: 100 }
        target: { type: number, minimum: 0, maximum: 100 }
        status:
          type: string
          enum: [mastered, developing, missing]
        priority:
          type: string
          enum: [high, medium, low]
        recommendation: { type: string }
    Activity:
      type: object
      required: [id, type, title, detail, time]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        detail: { type: string }
        time: { type: string }
    ChatMessageInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        context:
          type: string
          enum: [study, career, roadmap, skills]
    ChatMessage:
      type: object
      required: [id, role, message, suggestions]
      properties:
        id: { type: string }
        role:
          type: string
          enum: [assistant]
        message: { type: string }
        suggestions:
          type: array
          items: { type: string }
    Opportunity:
      type: object
      required: [id, title, kind, organization, deadline, location, description, eligibility, featured, saved, accent]
      properties:
        id: { type: string }
        title: { type: string }
        kind:
          type: string
          enum: [scholarship, internship, hackathon, event, job]
        organization: { type: string }
        deadline: { type: string }
        location: { type: string }
        description: { type: string }
        eligibility: { type: string }
        featured: { type: boolean }
        saved: { type: boolean }
        accent: { type: string }
    SavedUpdate:
      type: object
      required: [saved]
      properties:
        saved: { type: boolean }
    CommunityPost:
      type: object
      required: [id, author, initials, group, title, body, likes, replies, liked, time]
      properties:
        id: { type: string }
        author: { type: string }
        initials: { type: string }
        group: { type: string }
        title: { type: string }
        body: { type: string }
        likes: { type: number }
        replies: { type: number }
        liked: { type: boolean }
        time: { type: string }
    CommunityPostInput:
      type: object
      required: [title, body, group]
      properties:
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        group: { type: string, minLength: 1 }
    LikeUpdate:
      type: object
      required: [liked]
      properties:
        liked: { type: boolean }
    Quiz:
      type: object
      required: [id, title, category, questions, xp, progress, accent]
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        questions: { type: number }
        xp: { type: number }
        progress: { type: number, minimum: 0, maximum: 100 }
        accent: { type: string }
    TeacherDashboard:
      type: object
      required: [teacherName, classes, activeStudents, assignmentsToReview, averageProgress, classGroups, recentSubmissions]
      properties:
        teacherName: { type: string }
        classes: { type: number }
        activeStudents: { type: number }
        assignmentsToReview: { type: number }
        averageProgress: { type: number }
        classGroups:
          type: array
          items:
            $ref: "#/components/schemas/TeacherClass"
        recentSubmissions:
          type: array
          items:
            $ref: "#/components/schemas/StudentSubmission"
    TeacherClass:
      type: object
      required: [id, name, subject, students, progress, next]
      properties:
        id: { type: string }
        name: { type: string }
        subject: { type: string }
        students: { type: number }
        progress: { type: number, minimum: 0, maximum: 100 }
        next: { type: string }
    StudentSubmission:
      type: object
      required: [id, student, assignment, className, score, status, time]
      properties:
        id: { type: string }
        student: { type: string }
        assignment: { type: string }
        className: { type: string }
        score: { type: number }
        status:
          type: string
          enum: [submitted, needs_review, reviewed]
        time: { type: string }

